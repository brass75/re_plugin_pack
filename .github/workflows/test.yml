name: Tests
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - "src/re_plugin_pack/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - "src/re_plugin_pack/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  test-against-python-matrix:
    name: PyTest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ windows-latest, macos-latest, ubuntu-latest ]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run tests
        run: |
          uv run -p ${{ matrix.python-version }} pytest -vv
